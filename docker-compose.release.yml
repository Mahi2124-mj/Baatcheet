# Use the images GitHub Actions publishes (ghcr.io) instead of building from source.
# The machine running Baatcheet then needs no source code: only these compose files, the Caddyfile and .env.
services:
  server:
    image: ghcr.io/YOUR_GITHUB_USER/baatcheet-server:${BAATCHEET_TAG:-latest}
    build: !reset null
    pull_policy: always
  web:
    image: ghcr.io/YOUR_GITHUB_USER/baatcheet-web:${BAATCHEET_TAG:-latest}
    build: !reset null
    pull_policy: always
