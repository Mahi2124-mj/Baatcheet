# Copy to deploy/livekit.yaml for production group calls. Docs: https://docs.livekit.io/home/self-hosting/deployment/
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
keys:
  # Same values as LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env. Generate: openssl rand -hex 24
  REPLACE_WITH_API_KEY: REPLACE_WITH_LONG_API_SECRET
# Put LiveKit behind TLS (e.g. wss://rtc.example.com via Caddy) and set LIVEKIT_URL to that address.
